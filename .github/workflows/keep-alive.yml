name: Keep Render Awake
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to keep it awake
        run: curl -sS -o /dev/null -w "Status: %{http_code}\n" https://tracking-website-t1a1.onrender.com/
