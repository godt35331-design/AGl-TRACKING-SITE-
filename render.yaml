services:
  - type: static
    name: Tracking-website
    buildCommand: node build.js
    staticPublishPath: ./dist
  - type: web
    name: Tracking-website-service
    env: node
    buildCommand: node build.js
    startCommand: cd backend && node src/server.js
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      # Secret the administrator types on the Track Shipment screen. You choose it; 16+ random characters.
      # Administrator sign-in stays disabled until this is set.
      - key: ADMIN_TRACKING_CODE
        sync: false
      # Signs login sessions. Render generates a strong random value for you on first deploy.
      - key: AUTH_SECRET
        generateValue: true
