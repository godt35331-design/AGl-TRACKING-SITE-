<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Slate Navy to Cerulean Blue -->
    <linearGradient id="aglBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Cyan Speed Wing Gradient -->
    <linearGradient id="cyanWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Logistics Gold Accent -->
    <linearGradient id="goldStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="15" fill="url(#aglBg)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Global Freight Latitude/Orbit Arc -->
  <path d="M 12 46 C 22 53, 42 53, 52 46 C 42 49, 22 49, 12 46 Z" fill="url(#goldStreak)" />

  <!-- Outer Bold White Chevron Wings forming the 'A' -->
  <path d="M 32 10 L 15 45 L 23 45 L 32 24 L 41 45 L 49 45 Z" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Inner Cyan Aerodynamic Jet Needle -->
  <path d="M 32 15 L 25 36 L 32 31 L 39 36 Z" fill="url(#cyanWing)" />

  <!-- High-Speed Logistics Crossbar Streak in Brand Gold -->
  <polygon points="21,35 43,35 45,38.5 19,38.5" fill="url(#goldStreak)" />
</svg>
